[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screensim"
version = "0.1.0"
description = "A deterministic iPhone simulator for benchmarking real-time assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pillow>=10.0", "requests>=2.31",
    "async-timeout>=4; python_version < '3.11'",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]          # the phone screen is rendered in headless chromium
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
anthropic = ["anthropic>=0.80"]
video = ["numpy>=1.24"]
all = ["playwright>=1.44", "openai>=1.40", "google-genai>=0.3", "anthropic>=0.80", "numpy>=1.24"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
screensim-case = "screensim_bench.cli.case:main"
screensim-roster = "screensim_bench.cli.roster:main"
screensim-episode = "screensim_bench.cli.episode:main"
screensim-benchmark = "screensim_bench.cli.benchmark:main"
screensim-score = "screensim_bench.cli.score:main"
screensim-grade = "screensim_bench.cli.grade:main"

[tool.setuptools.packages.find]
include = ["screensim*", "screensim_bench*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
