[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivg-submission"
version = "0.1.0"
description = "Data-only submissions and maintainer review tools for IVG-Bench"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = []

[project.scripts]
ivg-submit = "ivg_submission.cli:main"

[tool.setuptools]
packages = ["ivg_submission"]

[tool.setuptools.package-data]
ivg_submission = ["catalog.json"]
